# Broker MQTT da linha. Aberto na rede local para as placas ESP32 alcançarem.
# Para exigir usuário e senha: crie um arquivo de senhas e troque allow_anonymous para false
# (ver docs/HARDWARE.md, "Broker com senha").
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
