; Firmware da estação (Smart Factory Assembly Line).
;
;   pio run -e esp32-asm -t upload     grava a estação "asm" (troque pelo ambiente da estação)
;   pio device monitor                 monitor serial (115200)
;   pio test -e native                 testes do núcleo no PC
;   ./sim/build.sh                     núcleo como biblioteca para o simulador
;
; Cada estação física é um ambiente: muda só o identificador e o sensor de temperatura.
; Versões fixadas para o binário ser reproduzível.

[platformio]
default_envs = esp32-asm

[esp32]
platform = platformio/espressif32@6.9.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    256dpi/MQTT@2.5.2
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
fw = -DSFAL_FW_VERSION=\"1.0.0\"

[env:esp32-smt]
extends = esp32
build_flags = ${esp32.fw} -DSFAL_STATION_ID=\"smt\" -DSFAL_TEMP_MAX6675

[env:esp32-aoi]
extends = esp32
build_flags = ${esp32.fw} -DSFAL_STATION_ID=\"aoi\"

[env:esp32-asm]
extends = esp32
build_flags = ${esp32.fw} -DSFAL_STATION_ID=\"asm\" -DSFAL_TEMP_DHT22

[env:esp32-tst]
extends = esp32
build_flags = ${esp32.fw} -DSFAL_STATION_ID=\"tst\"

[env:esp32-pkg]
extends = esp32
build_flags = ${esp32.fw} -DSFAL_STATION_ID=\"pkg\"

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*>
